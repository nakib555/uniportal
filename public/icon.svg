<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle drop shadow matching the user-uploaded image -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8c1515" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Deep Crimson Rounded Squircle -->
  <rect 
    x="40" 
    y="40" 
    width="432" 
    height="432" 
    rx="124" 
    ry="124" 
    fill="#8c1515" 
    filter="url(#shadow)" 
  />

  <!-- High-Precision White Graduation Cap (Mortarboard & Tassel) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mortarboard Diamond Top -->
    <polygon 
      points="256,155 400,215 256,275 112,215" 
      stroke-width="26" 
      fill="none" 
    />
    
    <!-- Skull Cap / Headband Base Arc -->
    <path 
      d="M174,242 v56 c0,38 42,66 82,66 s82,-28 82,-66 v-56" 
      stroke-width="26" 
      fill="none" 
    />
    
    <!-- Hanging Tassel Cord & Bead -->
    <path 
      d="M374,228 v92" 
      stroke-width="24" 
    />
    <circle 
      cx="374" 
      cy="332" 
      r="13" 
      fill="#ffffff" 
      stroke="none" 
    />
  </g>
</svg>
